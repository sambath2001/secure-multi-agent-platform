name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Offline tests
        run: python -m pytest -q

      - name: Simulated attack eval (no real LLM, no secrets)
        run: python -m evals.run_eval --suite attacks --client gullible --config all --out /tmp/ci-results
